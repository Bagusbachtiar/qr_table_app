<!DOCTYPE html>
<html>
<head>
  <title>Manage Menu</title>
</head>
<body>
  <h1>Manage Menu</h1>
  <form id="add-menu-form">
  <input type="text" id="item-name" placeholder="Item name" required>
  <input type="number" id="item-price" placeholder="Price in Rupiah" min="1" step="1" required>
  <input type="text" id="item-category" placeholder="Category, e.g. Drinks">
  <textarea id="item-description" placeholder="Description"></textarea>
  <button type="submit">Add Item</button>
</form>
  <div id="menu-list"></div>
  <script src="menu.js"></script>
</body>
</html>
